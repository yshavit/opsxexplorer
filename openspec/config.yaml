schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  opsxexplorer is a terminal UI (Rust, ratatui) for browsing OpenSpec
  changes and specs within a local git repo.

  It reads OpenSpec's own file layout:
    - Spec of record: ./openspec/specs/${capability}/spec.md
    - Active change:  ./openspec/changes/${change-name}/
    - Archived change: ./openspec/changes/archive/${date}-${change-name}/
  Each change directory contains proposal.md, specs/${capability}/spec.md,
  design.md, and tasks.md.

  Core problem this tool solves: a change's spec.md has "## ADDED
  Requirements" and "## MODIFIED Requirements" sections, but the MODIFIED
  section does not reliably print each requirement in full — it may restate
  the requirement or supply only the pieces that changed, and the two are
  indistinguishable in the source. opsxexplorer computes and renders the
  delta against the spec of record, and content present in the spec of
  record but unmentioned by the delta is ambiguous by construction and is
  surfaced as such rather than guessed at.

  Diff unit is a single requirement, not the whole spec.md file. For each
  change, for each capability it touches, show:
    - added requirements as +++ (green)
    - removed requirements as --- (red)
    - modified requirements as a word-level inline diff against the
      corresponding requirement in the spec of record

  Diff base selection (this is the trickiest invariant to preserve):
    - active change   -> spec of record at HEAD
    - archived change -> spec of record as it was at the commit
                         immediately BEFORE the commit that archived it
                         (not the archiving commit itself, not current HEAD)
  This requires walking git history (git2), not just reading working-tree
  files.

  UI flow: list changes (active first, then archived) -> select a change ->
  see per-capability requirement diffs.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  archive:
    guidance:
      - >-
        Check for source comments that reference a "design.md" without the
        full archived directory name (`YYYY-MM-DD-change-name/design.md`).
        This has two distinct shapes, so one grep alone won't catch both:
        (1) no directory at all - `grep -rnE '(^|[^/])design\.md' src/`
        (intentionally not a lookbehind, for portability); (2) a directory
        that's missing the date prefix, which happens when a comment is
        written while the change is still active (e.g.
        `some-change-name/design.md`) and never revisited at archive time -
        `grep -rnE '/design\.md' src/ | grep -vE '[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-zA-Z0-9_-]+/design\.md'`.
        If this change introduced or edited any of the flagged comments,
        update them before finishing the archive to name this change's own
        archived directory instead, e.g. replace "design.md" or
        "this-change-name/design.md" with
        "`YYYY-MM-DD-this-change-name/design.md`" using the actual directory
        this change is being archived as.
